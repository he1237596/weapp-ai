name: Deploy Wedding Planner

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '18'
  PYTHON_VERSION: '3.9'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run frontend tests
        run: npm test -- --passWithNoTests
        
      - name: Install Cloudflare Workers dependencies
        run: |
          cd cloudflare-workers
          npm ci
          
      - name: Run Cloudflare Workers tests
        run: |
          cd cloudflare-workers
          npm test -- --passWithNoTests
          
      - name: Type check
        run: npm run type-check || echo "Type check skipped (no script defined)"
        
      - name: Lint
        run: npm run lint || echo "Linting skipped (no script defined)"

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/develop'
    environment: staging
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build frontend
        run: npm run build:h5
        env:
          NODE_ENV: staging
          REACT_APP_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          REACT_APP_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          REACT_APP_CLOUDFLARE_API_URL: ${{ secrets.CLOUDFLARE_API_URL_STAGING }}
          
      - name: Deploy to staging (Frontend)
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist-h5
          destination_dir: staging
          
      - name: Install Wrangler
        run: npm install -g wrangler
        
      - name: Deploy Cloudflare Workers (Staging)
        run: |
          cd cloudflare-workers
          npm ci
          echo "${{ secrets.SUPABASE_SERVICE_KEY }}" | wrangler secret put SUPABASE_SERVICE_KEY --env staging
          echo "${{ secrets.SUPABASE_URL }}" | wrangler secret put SUPABASE_URL --env staging
          wrangler deploy --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build frontend
        run: npm run build:h5
        env:
          NODE_ENV: production
          REACT_APP_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          REACT_APP_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          REACT_APP_CLOUDFLARE_API_URL: ${{ secrets.CLOUDFLARE_API_URL_PRODUCTION }}
          
      - name: Deploy to production (Frontend)
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist-h5
          destination_dir: production
          
      - name: Install Wrangler
        run: npm install -g wrangler
        
      - name: Deploy Cloudflare Workers (Production)
        run: |
          cd cloudflare-workers
          npm ci
          echo "${{ secrets.SUPABASE_SERVICE_KEY }}" | wrangler secret put SUPABASE_SERVICE_KEY --env production
          echo "${{ secrets.SUPABASE_URL }}" | wrangler secret put SUPABASE_URL --env production
          wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          
      - name: Notify deployment
        if: success()
        run: |
          echo "🎉 Production deployment successful!"
          echo "Frontend: https://your-domain.com"
          echo "API: https://api.your-domain.com"

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Run npm audit
        run: npm audit --audit-level moderate
        
      - name: Run CodeQL Analysis
        uses: github/codeql-action/init@v2
        with:
          languages: javascript
          
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v2

  performance-test:
    name: Performance Test
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/develop'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          
      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.12.x
        
      - name: Run Lighthouse CI
        run: |
          lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
          LHCI_SERVER_BASE_URL: https://staging-your-domain.com
          
      - name: Performance budget check
        run: |
          # 检查包大小是否超出预算
          npx bundlesize

  database-migration:
    name: Database Migration
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Supabase CLI
        run: |
          sh -c "$(curl -fsSL https://supabase.com/install.sh)"
          
      - name: Run database migration
        run: |
          supabase login --token ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          supabase db push --db-url ${{ secrets.SUPABASE_DB_URL }}
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

  notify:
    name: Notify Deployment
    runs-on: ubuntu-latest
    needs: [deploy-production, database-migration]
    if: always() && github.ref == 'refs/heads/main'
    
    steps:
      - name: Notify success
        if: needs.deploy-production.result == 'success' && needs.database-migration.result == 'success'
        run: |
          echo "🎉 All deployments completed successfully!"
          # 可以在这里添加 Slack、Discord 或邮件通知
          
      - name: Notify failure
        if: needs.deploy-production.result == 'failure' || needs.database-migration.result == 'failure'
        run: |
          echo "❌ Deployment failed!"
          # 可以在这里添加失败通知
          exit 1